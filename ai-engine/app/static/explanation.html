<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalluciShield - Explainable Recommendation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419; color: #e1e8ed; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { color: #8899a6; margin-top: 8px; }
        .input-section {
            background: #1a2332; border-radius: 12px; padding: 20px;
            margin-bottom: 30px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;
        }
        .input-group { flex: 1; min-width: 200px; }
        .input-group label { display: block; margin-bottom: 8px; color: #8899a6; font-size: 0.9rem; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px 15px; border: 1px solid #38444d;
            border-radius: 8px; background: #253341; color: #e1e8ed; font-size: 1rem;
        }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #667eea; }
        .input-group textarea { min-height: 80px; font-family: monospace; font-size: 0.85rem; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .loading { text-align: center; padding: 40px; color: #8899a6; }
        .hidden { display: none; }

        .confidence-hero {
            background: #1a2332; border-radius: 12px; padding: 30px;
            margin-bottom: 30px; text-align: center; border-top: 4px solid #667eea;
        }
        .confidence-hero.safe { border-top-color: #06d6a0; }
        .confidence-hero.unsafe { border-top-color: #e0245e; }
        .confidence-hero .score { font-size: 4rem; font-weight: 700; line-height: 1; }
        .confidence-hero .label { color: #8899a6; font-size: 1.1rem; margin-top: 8px; }
        .confidence-hero .badge {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 600; margin-top: 12px;
        }
        .badge-safe { background: rgba(6,214,160,0.15); color: #06d6a0; }
        .badge-unsafe { background: rgba(224,36,94,0.15); color: #e0245e; }

        .why-section {
            background: #1a2332; border-radius: 12px; padding: 25px;
            margin-bottom: 30px; border-left: 5px solid #667eea;
        }
        .why-section h2 { font-size: 1.5rem; margin-bottom: 15px; }
        .why-section p { color: #c4cdd5; line-height: 1.7; font-size: 1.05rem; }

        .checklist {
            background: #1a2332; border-radius: 12px; padding: 25px; margin-bottom: 30px;
        }
        .checklist h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .checklist-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid #253341;
        }
        .checklist-item:last-child { border-bottom: none; }
        .check-icon {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: 700; flex-shrink: 0; margin-top: 2px;
        }
        .check-pass { background: rgba(6,214,160,0.15); color: #06d6a0; }
        .check-fail { background: rgba(224,36,94,0.15); color: #e0245e; }
        .check-content { flex: 1; }
        .check-title { font-weight: 600; font-size: 0.95rem; }
        .check-detail { color: #8899a6; font-size: 0.85rem; margin-top: 3px; }

        .features-section {
            background: #1a2332; border-radius: 12px; padding: 25px; margin-bottom: 30px;
        }
        .features-section h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .feature-row {
            display: grid; grid-template-columns: 140px 1fr 80px 80px;
            gap: 12px; padding: 10px 0; border-bottom: 1px solid #253341;
            align-items: center; font-size: 0.9rem;
        }
        .feature-row:last-child { border-bottom: none; }
        .feature-name { color: #8899a6; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
        .feature-bar { width: 100%; height: 8px; background: #253341; border-radius: 4px; overflow: hidden; }
        .feature-bar-fill { height: 100%; border-radius: 4px; }
        .feature-bar-fill.pass { background: #06d6a0; }
        .feature-bar-fill.fail { background: #e0245e; }
        .feature-score { text-align: right; font-weight: 600; }
        .feature-contrib { color: #8899a6; text-align: right; font-size: 0.85rem; }

        .evidence-section {
            background: #1a2332; border-radius: 12px; padding: 25px; margin-bottom: 30px;
        }
        .evidence-section h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .evidence-list { list-style: none; }
        .evidence-list li {
            padding: 8px 12px; margin-bottom: 6px; border-radius: 6px;
            font-size: 0.9rem; background: #253341;
        }
        .evidence-pos { border-left: 3px solid #06d6a0; }
        .evidence-neg { border-left: 3px solid #e0245e; }
        .evidence-fail { border-left: 3px solid #ff6b35; }

        .security-comparison {
            background: #1a2332; border-radius: 12px; padding: 25px; margin-bottom: 30px;
        }
        .security-comparison h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .sec-row {
            display: grid; grid-template-columns: 1fr 100px 100px 80px;
            gap: 12px; padding: 10px 0; border-bottom: 1px solid #253341;
            align-items: center; font-size: 0.9rem;
        }
        .sec-row:last-child { border-bottom: none; }
        .sec-header { color: #8899a6; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .sec-type { font-weight: 600; }
        .sec-delta { text-align: center; }
        .sec-improved { color: #06d6a0; }
        .sec-not-improved { color: #e0245e; }

        .no-results { text-align: center; padding: 60px 20px; color: #8899a6; }
        .no-results h3 { margin-bottom: 10px; color: #e1e8ed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Explainable Security Recommendation</h1>
            <p class="subtitle">Why This Patch? - Evidence-Based Explanation</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="vulnId">Vulnerability ID</label>
                <input type="text" id="vulnId" placeholder="e.g. vuln-001">
            </div>
            <div class="input-group">
                <label for="patchId">Patch ID</label>
                <input type="text" id="patchId" placeholder="e.g. patch-A">
            </div>
            <div class="input-group">
                <label for="valResults">Validation Results (JSON)</label>
                <textarea id="valResults" placeholder='[{"patch_id":"A","compilation_score":{"success":true,"score":1.0},...}]'></textarea>
            </div>
            <button class="btn btn-primary" onclick="getExplanation()">Get Explanation</button>
        </div>

        <div id="loading" class="loading hidden"><p>Generating explanation...</p></div>
        <div id="results" class="hidden"></div>
    </div>

    <script>
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function renderChecklistItem(label, passed, detail) {
            return `
                <div class="checklist-item">
                    <div class="check-icon ${passed ? 'check-pass' : 'check-fail'}">${passed ? '\u2713' : '\u2717'}</div>
                    <div class="check-content">
                        <div class="check-title">${esc(label)}</div>
                        <div class="check-detail">${esc(detail)}</div>
                    </div>
                </div>`;
        }

        function renderResults(data) {
            const exp = data.explanation;
            const el = document.getElementById('results');
            el.classList.remove('hidden');
            let h = '';

            const safe = exp.meets_safety_threshold;
            const scoreColor = exp.confidence_score >= 75 ? '#06d6a0'
                : exp.confidence_score >= 50 ? '#ffd166'
                : exp.confidence_score >= 25 ? '#ff6b35' : '#e0245e';

            h += `<div class="confidence-hero ${safe ? 'safe' : 'unsafe'}">
                <div class="score" style="color:${scoreColor}">${exp.confidence_score.toFixed(1)}%</div>
                <div class="label">Confidence Score</div>
                <div class="badge ${safe ? 'badge-safe' : 'badge-unsafe'}">
                    ${safe ? 'Meets Safety Threshold' : 'Below Safety Threshold'} (${exp.safety_threshold}%)
                </div>
            </div>`;

            h += `<div class="why-section">
                <h2>WHY THIS PATCH?</h2>
                <p>${esc(exp.why_this_patch)}</p>
            </div>`;

            if (exp.checklist) {
                const c = exp.checklist;
                h += `<div class="checklist"><h2>Validation Checklist</h2>`;
                h += renderChecklistItem('Compilation Passed', c.compilation_passed, c.compilation_detail);
                h += renderChecklistItem('Unit Tests Passed', c.unit_tests_passed, c.unit_tests_detail);
                h += renderChecklistItem('Regression Tests Passed', c.regression_tests_passed, c.regression_tests_detail);
                h += renderChecklistItem('Security Findings Reduced', c.security_findings_reduced, c.security_detail);
                h += renderChecklistItem('No Critical Vulnerability Introduced', c.no_critical_vulnerability, c.critical_detail);
                h += renderChecklistItem('Performance Within Threshold', c.performance_acceptable, c.performance_detail);
                h += renderChecklistItem('Historical Success Rate', c.historical_success_rate, c.historical_detail);
                h += `</div>`;
            }

            if (exp.feature_contributions && exp.feature_contributions.length > 0) {
                h += `<div class="features-section"><h2>Feature Contributions</h2>`;
                exp.feature_contributions.forEach(f => {
                    const barPct = (f.normalized_value * 100).toFixed(0);
                    h += `<div class="feature-row">
                        <div class="feature-name">${esc(f.feature_name)}</div>
                        <div class="feature-bar"><div class="feature-bar-fill ${f.passed ? 'pass' : 'fail'}" style="width:${barPct}%"></div></div>
                        <div class="feature-score" style="color:${f.passed ? '#06d6a0' : '#e0245e'}">${(f.weighted_score * 100).toFixed(1)}%</div>
                        <div class="feature-contrib">${f.contribution_pct.toFixed(1)}% of total</div>
                    </div>`;
                });
                h += `</div>`;
            }

            if (exp.validation_evidence && exp.validation_evidence.length > 0) {
                h += `<div class="evidence-section"><h2>Validation Evidence</h2><ul class="evidence-list">`;
                exp.validation_evidence.forEach(e => {
                    const cls = e.startsWith('[+]') ? 'evidence-pos' : e.startsWith('[-]') ? 'evidence-neg' : 'evidence-fail';
                    h += `<li class="${cls}">${esc(e)}</li>`;
                });
                h += `</ul></div>`;
            }

            if (exp.security_comparison && exp.security_comparison.length > 0) {
                h += `<div class="security-comparison"><h2>Security Findings Comparison</h2>`;
                h += `<div class="sec-row">
                    <div class="sec-header">Finding Type</div>
                    <div class="sec-header">Before</div>
                    <div class="sec-header">After</div>
                    <div class="sec-header">Status</div>
                </div>`;
                exp.security_comparison.forEach(s => {
                    h += `<div class="sec-row">
                        <div class="sec-type">${esc(s.finding_type)}</div>
                        <div>${s.before_count}</div>
                        <div>${s.after_count}</div>
                        <div class="sec-delta ${s.improved ? 'sec-improved' : 'sec-not-improved'}">${s.improved ? '\u2713 Fixed' : `${s.delta} delta`}</div>
                    </div>`;
                });
                h += `</div>`;
            }

            el.innerHTML = h;
        }

        async function getExplanation() {
            const vulnId = document.getElementById('vulnId').value.trim();
            const patchId = document.getElementById('patchId').value.trim();
            const valStr = document.getElementById('valResults').value.trim();
            if (!vulnId) { alert('Enter vulnerability ID'); return; }
            if (!patchId) { alert('Enter patch ID'); return; }
            if (!valStr) { alert('Enter validation results JSON'); return; }
            let vr;
            try { vr = JSON.parse(valStr); if (!Array.isArray(vr)) vr = [vr]; }
            catch(e) { alert('Invalid JSON: ' + e.message); return; }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            try {
                const res = await fetch(
                    '/api/v1/vulnerabilities/' + encodeURIComponent(vulnId) + '/patches/' + encodeURIComponent(patchId) + '/explanation',
                    { method: 'POST', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({ vulnerability_id: vulnId, validation_results: vr }) }
                );
                const data = await res.json();
                renderResults(data);
            } catch(e) { alert('Error: ' + e.message); }
            finally { document.getElementById('loading').classList.add('hidden'); }
        }
    </script>
</body>
</html>
