<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalluciShield - Patch Recommendation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e1e8ed;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: #8899a6; margin-top: 8px; }
        .input-section {
            background: #1a2332;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .input-group { flex: 1; min-width: 200px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #8899a6;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #38444d;
            border-radius: 8px;
            background: #253341;
            color: #e1e8ed;
            font-size: 1rem;
        }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .loading { text-align: center; padding: 40px; color: #8899a6; }
        .hidden { display: none; }

        .recommendation-banner {
            background: #1a2332;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .recommendation-banner.safe { border-left-color: #06d6a0; }
        .recommendation-banner.unsafe { border-left-color: #e0245e; }
        .recommendation-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #253341;
            flex-shrink: 0;
        }
        .recommendation-banner.safe .recommendation-icon { background: rgba(6, 214, 160, 0.15); }
        .recommendation-banner.unsafe .recommendation-icon { background: rgba(224, 36, 94, 0.15); }
        .recommendation-text h2 { font-size: 1.4rem; margin-bottom: 5px; }
        .recommendation-text p { color: #8899a6; font-size: 0.95rem; }

        .ranking-table {
            background: #1a2332;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .ranking-table h3 {
            color: #e1e8ed;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: #8899a6;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #38444d;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #253341;
            font-size: 0.95rem;
        }
        tr:hover td { background: #253341; }
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #0f1419; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #0f1419; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b8690e); color: #0f1419; }
        .rank-other { background: #38444d; color: #8899a6; }
        .confidence-bar {
            width: 120px;
            height: 8px;
            background: #38444d;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .confidence-high { background: #06d6a0; }
        .confidence-medium { background: #ffd166; }
        .confidence-low { background: #ff6b35; }
        .confidence-critical { background: #e0245e; }
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pass { background: rgba(6, 214, 160, 0.15); color: #06d6a0; }
        .status-fail { background: rgba(224, 36, 94, 0.15); color: #e0245e; }
        .status-warning { background: rgba(255, 209, 102, 0.15); color: #ffd166; }
        .status-unknown { background: rgba(136, 153, 166, 0.15); color: #8899a6; }
        .safe-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .safe-yes { background: rgba(6, 214, 160, 0.15); color: #06d6a0; }
        .safe-no { background: rgba(224, 36, 94, 0.15); color: #e0245e; }

        .detail-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .detail-card {
            background: #1a2332;
            border-radius: 12px;
            padding: 20px;
            border-top: 3px solid #667eea;
        }
        .detail-card.recommended { border-top-color: #06d6a0; }
        .detail-card.not-recommended { border-top-color: #e0245e; }
        .detail-card h4 { margin-bottom: 12px; font-size: 1.1rem; }
        .detail-card .patch-id {
            color: #667eea;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .detail-card .score {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .detail-card .label {
            color: #8899a6;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .detail-card .evidence-list {
            list-style: none;
            margin-top: 10px;
        }
        .detail-card .evidence-list li {
            padding: 4px 0;
            font-size: 0.85rem;
            color: #c4cdd5;
            border-bottom: 1px solid #253341;
        }
        .detail-card .evidence-list li:last-child { border-bottom: none; }
        .evidence-positive { color: #06d6a0; }
        .evidence-negative { color: #e0245e; }
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #8899a6;
        }
        .no-results h3 { margin-bottom: 10px; color: #e1e8ed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Patch Recommendation</h1>
            <p class="subtitle">Adaptive Confidence Engine - Patch Ranking & Recommendation</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="vulnId">Vulnerability ID</label>
                <input type="text" id="vulnId" placeholder="e.g. vuln-001">
            </div>
            <div class="input-group">
                <label for="valResults">Validation Results (JSON)</label>
                <input type="text" id="valResults" placeholder='[{"patch_id":"A","compilation_score":{"success":true,"score":1.0},...}]'>
            </div>
            <div class="input-group" style="max-width:150px">
                <label for="threshold">Safety Threshold</label>
                <input type="number" id="threshold" value="50" min="0" max="100">
            </div>
            <button class="btn btn-primary" onclick="getRecommendation()">Get Recommendation</button>
        </div>

        <div id="loading" class="loading hidden">
            <p>Calculating recommendations...</p>
        </div>

        <div id="results" class="hidden"></div>
    </div>

    <script>
        function confidenceColor(score) {
            if (score >= 75) return 'confidence-high';
            if (score >= 50) return 'confidence-medium';
            if (score >= 25) return 'confidence-low';
            return 'confidence-critical';
        }

        function statusClass(status) {
            if (status === 'PASS') return 'status-pass';
            if (status === 'FAIL') return 'status-fail';
            if (status === 'WARNING') return 'status-warning';
            return 'status-unknown';
        }

        function rankBadgeClass(rank) {
            if (rank === 1) return 'rank-1';
            if (rank === 2) return 'rank-2';
            if (rank === 3) return 'rank-3';
            return 'rank-other';
        }

        function renderResults(data) {
            const rec = data.recommendation;
            const el = document.getElementById('results');
            el.classList.remove('hidden');

            let html = '';

            // Recommendation banner
            const safe = rec.meets_safety_threshold;
            html += `
                <div class="recommendation-banner ${safe ? 'safe' : 'unsafe'}">
                    <div class="recommendation-icon">${safe ? '&#10003;' : '&#10007;'}</div>
                    <div class="recommendation-text">
                        <h2>${rec.recommendation_text}</h2>
                        <p>${safe
                            ? 'The highest-confidence patch meets the safety threshold (' + rec.safety_threshold + '%).'
                            : 'No patch meets the minimum safety threshold (' + rec.safety_threshold + '%). Manual review required.'
                        }</p>
                    </div>
                </div>
            `;

            // Ranking table
            if (rec.ranked_patches && rec.ranked_patches.length > 0) {
                html += `
                    <div class="ranking-table">
                        <h3>Patch Rankings (${rec.total_patches} patches)</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Patch</th>
                                    <th>Security Improvement</th>
                                    <th>Validation</th>
                                    <th>Confidence</th>
                                    <th>Safe</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                rec.ranked_patches.forEach(p => {
                    html += `
                        <tr>
                            <td><span class="rank-badge ${rankBadgeClass(p.rank)}">${p.rank}</span></td>
                            <td><strong>${p.patch_id}</strong></td>
                            <td>${p.security_strategy || 'N/A'}</td>
                            <td><span class="status-badge ${statusClass(p.validation_status)}">${p.validation_status}</span></td>
                            <td>
                                <div class="confidence-bar"><div class="confidence-fill ${confidenceColor(p.confidence_score)}" style="width:${p.confidence_score}%"></div></div>
                                <span style="font-weight:600">${p.confidence_score.toFixed(1)}%</span>
                            </td>
                            <td><span class="safe-badge ${p.meets_safety_threshold ? 'safe-yes' : 'safe-no'}">${p.meets_safety_threshold ? 'YES' : 'NO'}</span></td>
                        </tr>
                    `;
                });

                html += '</tbody></table></div>';
            }

            // Detail cards for top 5
            if (rec.ranked_patches && rec.ranked_patches.length > 0) {
                html += '<div class="detail-cards">';
                rec.ranked_patches.slice(0, 5).forEach(p => {
                    const cardClass = p.meets_safety_threshold ? 'recommended' : 'not-recommended';
                    const scoreColor = confidenceColor(p.confidence_score).replace('confidence-', '');
                    html += `
                        <div class="detail-card ${cardClass}">
                            <div class="patch-id">${p.patch_id}</div>
                            <h4>#${p.rank} - ${p.recommendation_label}</h4>
                            <div class="score" style="color: var(--color-${scoreColor}, #e1e8ed)">${p.confidence_score.toFixed(1)}%</div>
                            <div class="label">${p.validation_status}</div>
                            <p style="font-size:0.9rem; color:#c4cdd5; margin-top:8px">${p.reasoning || ''}</p>
                            ${p.evidence && p.evidence.length > 0 ? `
                                <ul class="evidence-list">
                                    ${p.evidence.slice(0, 6).map(e => {
                                        const cls = e.startsWith('[+]') ? 'evidence-positive' : 'evidence-negative';
                                        return '<li class="' + cls + '">' + e + '</li>';
                                    }).join('')}
                                </ul>
                            ` : ''}
                        </div>
                    `;
                });
                html += '</div>';
            }

            // No results
            if (!rec.ranked_patches || rec.ranked_patches.length === 0) {
                html += `
                    <div class="no-results">
                        <h3>No Patches Available</h3>
                        <p>No validation results were provided to generate a recommendation.</p>
                    </div>
                `;
            }

            el.innerHTML = html;
        }

        async function getRecommendation() {
            const vulnId = document.getElementById('vulnId').value.trim();
            const valResultsStr = document.getElementById('valResults').value.trim();
            const threshold = parseFloat(document.getElementById('threshold').value) || 50;

            if (!vulnId) { alert('Please enter a vulnerability ID'); return; }
            if (!valResultsStr) { alert('Please enter validation results JSON'); return; }

            let validationResults;
            try {
                validationResults = JSON.parse(valResultsStr);
                if (!Array.isArray(validationResults)) validationResults = [validationResults];
            } catch(e) {
                alert('Invalid JSON: ' + e.message);
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const res = await fetch(
                    '/api/v1/vulnerabilities/' + encodeURIComponent(vulnId) + '/recommendation?safety_threshold=' + threshold,
                    {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            vulnerability_id: vulnId,
                            validation_results: validationResults,
                        }),
                    }
                );
                const data = await res.json();
                renderResults(data);
            } catch(e) {
                alert('Error: ' + e.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
