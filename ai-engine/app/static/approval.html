<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalluciShield - Patch Approval</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419; color: #e1e8ed; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { color: #8899a6; margin-top: 8px; }
        .input-section {
            background: #1a2332; border-radius: 12px; padding: 20px;
            margin-bottom: 30px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;
        }
        .input-group { flex: 1; min-width: 200px; }
        .input-group label { display: block; margin-bottom: 8px; color: #8899a6; font-size: 0.9rem; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px 15px; border: 1px solid #38444d;
            border-radius: 8px; background: #253341; color: #e1e8ed; font-size: 1rem;
        }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #667eea; }
        .input-group textarea { min-height: 80px; font-family: monospace; font-size: 0.85rem; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-approve {
            background: linear-gradient(135deg, #06d6a0 0%, #059669 100%); color: white;
            font-size: 1.1rem; padding: 14px 40px;
        }
        .btn-approve:hover {
            transform: translateY(-2px); box-shadow: 0 5px 20px rgba(6, 214, 160, 0.4);
        }
        .btn-reject {
            background: linear-gradient(135deg, #e0245e 0%, #be185d 100%); color: white;
            font-size: 1.1rem; padding: 14px 40px;
        }
        .btn-reject:hover {
            transform: translateY(-2px); box-shadow: 0 5px 20px rgba(224, 36, 94, 0.4);
        }
        .loading { text-align: center; padding: 40px; color: #8899a6; }
        .hidden { display: none; }
        .error { color: #e0245e; text-align: center; padding: 20px; }

        .decision-banner {
            background: #1a2332; border-radius: 12px; padding: 25px;
            margin-bottom: 30px; text-align: center; border-top: 4px solid #667eea;
        }
        .decision-banner.approved { border-top-color: #06d6a0; }
        .decision-banner.rejected { border-top-color: #e0245e; }
        .decision-banner .decision-text { font-size: 2rem; font-weight: 700; }
        .decision-banner .decision-detail { color: #8899a6; margin-top: 8px; font-size: 1rem; }

        .review-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;
        }
        @media (max-width: 900px) { .review-grid { grid-template-columns: 1fr; } }

        .code-panel {
            background: #1a2332; border-radius: 12px; padding: 20px; overflow: auto;
        }
        .code-panel h3 { margin-bottom: 12px; font-size: 1rem; color: #8899a6; }
        .code-panel pre {
            background: #253341; padding: 15px; border-radius: 8px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem;
            overflow-x: auto; white-space: pre; line-height: 1.6;
        }
        .code-panel.original { border-left: 4px solid #e0245e; }
        .code-panel.patched { border-left: 4px solid #06d6a0; }

        .diff-panel {
            background: #1a2332; border-radius: 12px; padding: 20px;
            margin-bottom: 30px; overflow: auto;
        }
        .diff-panel h3 { margin-bottom: 12px; font-size: 1rem; color: #8899a6; }
        .diff-panel pre {
            background: #253341; padding: 15px; border-radius: 8px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem;
            overflow-x: auto; white-space: pre; line-height: 1.6;
        }
        .diff-add { color: #06d6a0; }
        .diff-remove { color: #e0245e; }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;
        }
        @media (max-width: 900px) { .info-grid { grid-template-columns: 1fr; } }

        .info-card {
            background: #1a2332; border-radius: 12px; padding: 20px;
        }
        .info-card h3 { font-size: 1rem; color: #8899a6; margin-bottom: 12px; }
        .info-row {
            display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px solid #253341;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #8899a6; }
        .info-value { font-weight: 600; }

        .confidence-bar-section {
            background: #1a2332; border-radius: 12px; padding: 20px;
            margin-bottom: 30px;
        }
        .confidence-bar-section h3 { font-size: 1rem; color: #8899a6; margin-bottom: 15px; }
        .confidence-bar-wrapper {
            background: #253341; border-radius: 8px; height: 30px; overflow: hidden;
        }
        .confidence-bar {
            height: 100%; border-radius: 8px; display: flex; align-items: center;
            padding-left: 15px; font-weight: 700; font-size: 0.9rem; transition: width 0.5s ease;
        }
        .confidence-bar.high { background: linear-gradient(90deg, #06d6a0, #059669); }
        .confidence-bar.medium { background: linear-gradient(90deg, #ffd166, #f59e0b); }
        .confidence-bar.low { background: linear-gradient(90deg, #e0245e, #be185d); }

        .validation-section {
            background: #1a2332; border-radius: 12px; padding: 20px;
            margin-bottom: 30px;
        }
        .validation-section h3 { font-size: 1rem; color: #8899a6; margin-bottom: 15px; }
        .validation-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid #253341;
        }
        .validation-row:last-child { border-bottom: none; }
        .validation-icon {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
        }
        .validation-icon.pass { background: rgba(6,214,160,0.15); color: #06d6a0; }
        .validation-icon.fail { background: rgba(224,36,94,0.15); color: #e0245e; }
        .validation-name { flex: 1; }
        .validation-score { font-weight: 600; font-family: monospace; }

        .action-section {
            background: #1a2332; border-radius: 12px; padding: 30px;
            margin-bottom: 30px; text-align: center;
        }
        .action-section h3 { font-size: 1.2rem; margin-bottom: 20px; }
        .action-buttons { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .reject-reason { margin-top: 15px; }
        .reject-reason textarea {
            width: 100%; max-width: 500px; padding: 12px; border: 1px solid #38444d;
            border-radius: 8px; background: #253341; color: #e1e8ed; font-size: 0.95rem;
            min-height: 60px; resize: vertical;
        }

        .history-section {
            background: #1a2332; border-radius: 12px; padding: 20px; margin-bottom: 30px;
        }
        .history-section h3 { font-size: 1rem; color: #8899a6; margin-bottom: 15px; }
        .history-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid #253341;
        }
        .history-item:last-child { border-bottom: none; }
        .history-badge {
            padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;
        }
        .badge-approved { background: rgba(6,214,160,0.15); color: #06d6a0; }
        .badge-rejected { background: rgba(224,36,94,0.15); color: #e0245e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Patch Approval Workflow</h1>
            <p class="subtitle">Human-in-the-Loop - Developer review before deployment</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label>Vulnerability ID</label>
                <input type="text" id="vulnId" placeholder="e.g. vuln-001">
            </div>
            <div class="input-group">
                <label>Patch ID</label>
                <input type="text" id="patchId" placeholder="e.g. patch-001">
            </div>
            <div class="input-group">
                <label>Developer ID</label>
                <input type="text" id="devId" placeholder="e.g. dev-001">
            </div>
            <div class="input-group">
                <label>Original Code</label>
                <textarea id="originalCode" placeholder="Paste original vulnerable code..."></textarea>
            </div>
            <div class="input-group">
                <label>Patched Code</label>
                <textarea id="patchedCode" placeholder="Paste patched code..."></textarea>
            </div>
            <div class="input-group">
                <button class="btn btn-primary" onclick="loadReview()">Load Review</button>
            </div>
        </div>

        <div id="error" class="error hidden"></div>
        <div id="loading" class="loading hidden">Loading review...</div>

        <div id="decisionBanner" class="decision-banner hidden"></div>
        <div id="reviewContent" class="hidden"></div>
        <div id="actionSection" class="action-section hidden"></div>
        <div id="historySection" class="history-section hidden"></div>
    </div>

    <script>
        const API_BASE = '';

        async function loadReview() {
            const vulnId = document.getElementById('vulnId').value.trim();
            const patchId = document.getElementById('patchId').value.trim();
            const originalCode = document.getElementById('originalCode').value;
            const patchedCode = document.getElementById('patchedCode').value;

            if (!vulnId || !patchId) {
                showError('Vulnerability ID and Patch ID are required');
                return;
            }

            hideError();
            showLoading();

            try {
                const params = new URLSearchParams({
                    original_code: originalCode,
                    patched_code: patchedCode,
                });
                const resp = await fetch(`${API_BASE}/api/v1/vulnerabilities/${vulnId}/patches/${patchId}/review?${params}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const review = await resp.json();
                renderReview(review);
                loadApprovalStatus(vulnId, patchId);
            } catch (e) {
                showError(`Failed to load review: ${e.message}`);
            } finally {
                hideLoading();
            }
        }

        async function loadApprovalStatus(vulnId, patchId) {
            try {
                const resp = await fetch(`${API_BASE}/api/v1/vulnerabilities/${vulnId}/patches/${patchId}/approval-status`);
                if (!resp.ok) return;
                const data = await resp.json();
                if (data.record) {
                    renderDecisionBanner(data.record);
                }
            } catch (e) { /* ignore */ }
        }

        async function loadHistory() {
            const vulnId = document.getElementById('vulnId').value.trim();
            if (!vulnId) return;
            try {
                const resp = await fetch(`${API_BASE}/api/v1/vulnerabilities/${vulnId}/approvals`);
                if (!resp.ok) return;
                const data = await resp.json();
                if (data.approvals && data.approvals.length > 0) {
                    renderHistory(data.approvals);
                }
            } catch (e) { /* ignore */ }
        }

        function renderDecisionBanner(record) {
            const el = document.getElementById('decisionBanner');
            el.className = `decision-banner ${record.decision.toLowerCase()}`;
            el.innerHTML = `
                <div class="decision-text" style="color: ${record.decision === 'APPROVED' ? '#06d6a0' : '#e0245e'}">
                    ${record.decision === 'APPROVED' ? 'APPROVED' : 'REJECTED'}
                </div>
                <div class="decision-detail">
                    by ${record.developer_id} on ${record.approved_at || record.rejected_at}
                    ${record.rejection_reason ? `<br>Reason: ${record.rejection_reason}` : ''}
                </div>
            `;
            el.classList.remove('hidden');
        }

        function renderReview(review) {
            const el = document.getElementById('reviewContent');
            const confPct = review.confidence_score || 0;
            const confClass = confPct >= 75 ? 'high' : confPct >= 50 ? 'medium' : 'low';

            let validationHtml = '';
            if (review.validation_results) {
                const vr = review.validation_results;
                const dims = [
                    { name: 'Compilation', passed: vr.compilation_score?.success, score: vr.compilation_score?.score },
                    { name: 'Unit Tests', passed: vr.unit_test_score?.failed === 0 && vr.unit_test_score?.total_tests > 0, score: vr.unit_test_score?.score },
                    { name: 'Regression Tests', passed: vr.regression_score?.regressions_found === 0, score: vr.regression_score?.score },
                    { name: 'Security Scan', passed: vr.security_score?.vulnerabilities_found === 0, score: vr.security_score?.score },
                    { name: 'Functional Behavior', passed: vr.functional_score?.behavior_preserved, score: vr.functional_score?.score },
                    { name: 'Performance', passed: vr.performance_score?.within_acceptable_range, score: vr.performance_score?.score },
                ];
                validationHtml = dims.map(d => `
                    <div class="validation-row">
                        <div class="validation-icon ${d.passed ? 'pass' : 'fail'}">${d.passed ? '&#10003;' : '&#10007;'}</div>
                        <div class="validation-name">${d.name}</div>
                        <div class="validation-score">${d.score != null ? (d.score * 100).toFixed(0) + '%' : 'N/A'}</div>
                    </div>
                `).join('');
            }

            let explanationHtml = '';
            if (review.explanation && review.explanation.why_this_patch) {
                explanationHtml = `
                    <div class="info-card" style="margin-bottom: 20px; border-left: 4px solid #667eea;">
                        <h3>WHY THIS PATCH?</h3>
                        <p style="color: #c4cdd5; line-height: 1.7;">${review.explanation.why_this_patch}</p>
                    </div>
                `;
            }

            el.innerHTML = `
                ${explanationHtml}
                <div class="review-grid">
                    <div class="code-panel original">
                        <h3>Original Code (Vulnerable)</h3>
                        <pre>${escapeHtml(review.original_code)}</pre>
                    </div>
                    <div class="code-panel patched">
                        <h3>Patched Code</h3>
                        <pre>${escapeHtml(review.patched_code)}</pre>
                    </div>
                </div>
                ${review.diff ? `
                <div class="diff-panel">
                    <h3>Diff</h3>
                    <pre>${renderDiff(review.diff)}</pre>
                </div>
                ` : ''}
                <div class="info-grid">
                    <div class="info-card">
                        <h3>Vulnerability</h3>
                        <div class="info-row">
                            <span class="info-label">Type</span>
                            <span class="info-value">${review.vulnerability_type || 'N/A'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Severity</span>
                            <span class="info-value">${review.vulnerability_severity || 'N/A'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Strategy</span>
                            <span class="info-value">${review.security_strategy || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="info-card">
                        <h3>Details</h3>
                        <div class="info-row">
                            <span class="info-label">Vulnerability ID</span>
                            <span class="info-value">${review.vulnerability_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Patch ID</span>
                            <span class="info-value">${review.patch_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Description</span>
                            <span class="info-value">${review.vulnerability_description || 'N/A'}</span>
                        </div>
                    </div>
                </div>
                <div class="confidence-bar-section">
                    <h3>Confidence Score</h3>
                    <div class="confidence-bar-wrapper">
                        <div class="confidence-bar ${confClass}" style="width: ${confPct}%">
                            ${confPct.toFixed(1)}%
                        </div>
                    </div>
                </div>
                ${validationHtml ? `
                <div class="validation-section">
                    <h3>Validation Results</h3>
                    ${validationHtml}
                </div>
                ` : ''}
            `;
            el.classList.remove('hidden');

            const devId = document.getElementById('devId').value.trim();
            if (devId) {
                renderActions(review.vulnerability_id, review.patch_id, review.confidence_score);
            }
        }

        function renderActions(vulnId, patchId, confidenceScore) {
            const devId = document.getElementById('devId').value.trim();
            const el = document.getElementById('actionSection');
            el.innerHTML = `
                <h3>Developer Decision</h3>
                <p style="color: #8899a6; margin-bottom: 20px;">Review the patch above, then approve or reject.</p>
                <div class="action-buttons">
                    <button class="btn btn-approve" onclick="approvePatch('${vulnId}', '${patchId}', ${confidenceScore})">
                        Accept Patch
                    </button>
                    <button class="btn btn-reject" onclick="showRejectReason('${vulnId}', '${patchId}')">
                        Reject Patch
                    </button>
                </div>
                <div id="rejectReasonArea" class="reject-reason hidden">
                    <textarea id="rejectReason" placeholder="Optional: Why are you rejecting this patch?"></textarea>
                    <br><br>
                    <button class="btn btn-reject" onclick="rejectPatch('${vulnId}', '${patchId}')">
                        Confirm Rejection
                    </button>
                </div>
            `;
            el.classList.remove('hidden');
            loadHistory();
        }

        async function approvePatch(vulnId, patchId, confidenceScore) {
            const devId = document.getElementById('devId').value.trim();
            if (!devId) { showError('Developer ID required'); return; }

            try {
                const resp = await fetch(`${API_BASE}/api/v1/vulnerabilities/${vulnId}/patches/${patchId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        developer_id: devId,
                        patch_id: patchId,
                        vulnerability_id: vulnId,
                        confidence_score: confidenceScore,
                    }),
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                renderDecisionBanner(data.approval_record);
                document.getElementById('actionSection').classList.add('hidden');
                loadHistory();
            } catch (e) {
                showError(`Approval failed: ${e.message}`);
            }
        }

        function showRejectReason(vulnId, patchId) {
            document.getElementById('rejectReasonArea').classList.remove('hidden');
        }

        async function rejectPatch(vulnId, patchId) {
            const devId = document.getElementById('devId').value.trim();
            const reason = document.getElementById('rejectReason').value;
            if (!devId) { showError('Developer ID required'); return; }

            try {
                const resp = await fetch(`${API_BASE}/api/v1/vulnerabilities/${vulnId}/patches/${patchId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        developer_id: devId,
                        patch_id: patchId,
                        vulnerability_id: vulnId,
                        reason: reason,
                    }),
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                renderDecisionBanner(data.approval_record);
                document.getElementById('actionSection').classList.add('hidden');
                loadHistory();
            } catch (e) {
                showError(`Rejection failed: ${e.message}`);
            }
        }

        function renderHistory(approvals) {
            const el = document.getElementById('historySection');
            el.innerHTML = `
                <h3>Approval History</h3>
                ${approvals.map(a => `
                    <div class="history-item">
                        <span class="history-badge ${a.decision === 'APPROVED' ? 'badge-approved' : 'badge-rejected'}">
                            ${a.decision}
                        </span>
                        <span style="flex:1">${a.patch_id} by ${a.developer_id}</span>
                        <span style="color: #8899a6; font-size: 0.85rem;">${a.approved_at || a.rejected_at || a.created_at}</span>
                        ${a.rejection_reason ? `<span style="color: #e0245e; font-size: 0.85rem;"> - ${a.rejection_reason}</span>` : ''}
                    </div>
                `).join('')}
            `;
            el.classList.remove('hidden');
        }

        function renderDiff(diff) {
            return diff.split('\n').map(line => {
                if (line.startsWith('+')) return `<span class="diff-add">${escapeHtml(line)}</span>`;
                if (line.startsWith('-')) return `<span class="diff-remove">${escapeHtml(line)}</span>`;
                return escapeHtml(line);
            }).join('\n');
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text || '';
            return d.innerHTML;
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').classList.remove('hidden');
        }
        function hideError() { document.getElementById('error').classList.add('hidden'); }
        function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
    </script>
</body>
</html>
