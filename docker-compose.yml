services:
  postgres:
    image: postgres:16-alpine
    container_name: hallucishield-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hallucishield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-hallucishield_db}
      POSTGRES_SSL: "false"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hallucishield_user} -d ${POSTGRES_DB:-hallucishield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hallucishield-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hallucishield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-hallucishield_db}
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_API_KEY: ${HALLUCISHIELD_API_KEY}
      WORKSPACE_ROOT: /workspace
    volumes:
      - hallucishield_workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  ai-engine:
    build:
      context: .
      dockerfile: ai-engine/Dockerfile
    container_name: hallucishield-ai-engine
    restart: always
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    environment:
      PORT: 8000
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-openai/gpt-oss-20b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      HALLUCISHIELD_WORKSPACE_ROOT: /workspace
      HALLUCISHIELD_API_KEY: ${HALLUCISHIELD_API_KEY}
      SANDBOX_USE_ARCHIVE_TRANSFER: "true"
      SANDBOX_IMAGE: hallucishield-sandbox:latest
    volumes:
      - hallucishield_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=10)"]
      interval: 10s
      timeout: 15s
      retries: 10

  sandbox-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile.sandbox
    image: hallucishield-sandbox:latest
    command: ["sh", "-c", "exit 0"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: hallucishield-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_AI_ENGINE_URL: http://localhost:8000
    depends_on:
      - backend
      - ai-engine

volumes:
  postgres_data:
  hallucishield_workspace:
